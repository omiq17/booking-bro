services:
  postgres:
    image: postgres:16-alpine
    container_name: booking_bro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_bro
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d booking_bro']
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: booking_bro_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/booking_bro
      API_PORT: 3001
      API_HOST: 0.0.0.0
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://api:3001
    container_name: booking_bro_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '3000:3000'

volumes:
  postgres_data:
